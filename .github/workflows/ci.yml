name: Cypress Tests
 
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
 
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split tests across multiple containers for speed.
        # Adjust the number of runners or remove matrix entirely for a single run.
        containers: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      # If your app needs to be built/served before Cypress runs,
      # uncomment and adjust the following:
      # - name: Build app
      #   run: npm run build
 
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          # Uncomment if Cypress needs to start a local server first
          # start: npm start
          # wait-on: 'http://localhost:3000'
          browser: chrome
          record: false
        env:
          # If you use Cypress Cloud for recording/parallelization,
          # add CYPRESS_RECORD_KEY as a repo secret and set record: true above
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore
 
      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: cypress/videos
          if-no-files-found: ignore
